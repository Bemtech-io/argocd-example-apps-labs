apiVersion: batch/v1
kind: Job
metadata:
  name: presync-job
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: presync
          image: busybox
          command:
            ["sh", "-c", "echo Running database migrations... && sleep 30"]
      restartPolicy: Never
